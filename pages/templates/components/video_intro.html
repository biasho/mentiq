{% load static %}

<!-- Widget Video Server & Nút Khảo sát -->
<div class="bg-[var(--color-card-bg)] rounded-xl shadow-xl overflow-hidden ring-1 ring-[var(--color-border)]">
    <!-- Tiêu đề Widget -->
    <div class="p-4 bg-[var(--color-primary)] text-white">
        <h3 class="text-lg font-bold tracking-tight">
            <span class="lang-vi">Video Giới thiệu</span>
            <span class="lang-en" style="display: none;">Introduction Video</span>
        </h3>
        <p class="text-white/80 text-xs">
            <span class="lang-vi">Thước phim giới thiệu trực tiếp từ hệ thống Mentiq</span>
            <span class="lang-en" style="display: none;">Direct introduction footage from the Mentiq system</span>
        </p>
    </div>

    <div class="p-4 space-y-4">
        <!-- Khung chứa Video từ Server (Tỷ lệ 16:9 chuẩn) -->
        <div class="relative w-full aspect-video rounded-lg overflow-hidden bg-black shadow-inner">
            <video 
                class="w-full h-full object-cover"
                controls 
                preload="metadata"
                poster="{% static 'images/intro_image.jpg' %}">
                
                <source src="{% static 'videos/intro_video.mp4' %}" type="video/mp4">
                <span class="lang-vi">Trình duyệt của bạn không hỗ trợ thẻ video.</span>
                <span class="lang-en" style="display: none;">Your browser does not support the video tag.</span>
            </video>
        </div>

        <!-- Nút bấm hành động (CTA) -->
        <a href="#"
            class="w-full h-12 bg-[var(--color-accent)] hover:opacity-90 text-gray-900 font-bold rounded-lg shadow-lg flex items-center justify-center gap-2 transition-transform hover:scale-[1.02] active:scale-95">
            <span class="material-symbols-outlined text-[20px]">assignment</span>
            <span>
                <span class="lang-vi">Trải nghiệm ngay</span>
                <span class="lang-en" style="display: none;">Experience Now</span>
            </span>
        </a>
    </div>
</div>
